<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{SITE_TITLE}} — Your Daily Tech Companion</title>
  <meta name="description" content="{{SITE_DESCRIPTION}}" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="{{SITE_URL}}/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{SITE_TITLE}}" />
  <meta property="og:description" content="{{SITE_DESCRIPTION}}" />
  <meta property="og:url" content="{{SITE_URL}}/" />
  <meta property="og:site_name" content="{{SITE_TITLE}}" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{SITE_TITLE}}" />
  <meta name="twitter:description" content="{{SITE_DESCRIPTION}}" />

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="{{SITE_TITLE}} RSS" href="/rss.xml" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/styles.css" />

  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Blog",
    "name": "{{SITE_TITLE}}",
    "description": "{{SITE_DESCRIPTION}}",
    "url": "{{SITE_URL}}"
  }
  </script>
</head>
<body>
  <!-- Animated background -->
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <!-- Header -->
  <header class="site-header" id="site-header">
    <nav class="nav-container">
      <a href="/" class="logo" id="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">Tech<span class="logo-accent">Guru</span></span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link active">Blog</a>
        <a href="/rss.xml" class="nav-link rss-link" title="RSS Feed">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6.18 15.64a2.18 2.18 0 0 1 2.18 2.18C8.36 19 7.38 20 6.18 20C5 20 4 19 4 17.82a2.18 2.18 0 0 1 2.18-2.18M4 4.44A15.56 15.56 0 0 1 19.56 20h-2.83A12.73 12.73 0 0 0 4 7.27V4.44m0 5.66a9.9 9.9 0 0 1 9.9 9.9h-2.83A7.07 7.07 0 0 0 4 12.93V10.1Z"/></svg>
          RSS
        </a>
      </div>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero" id="hero">
    <div class="hero-content">
      <div class="hero-badge">
        <span class="pulse-dot"></span>
        {{POST_COUNT}} articles and counting
      </div>
      <h1 class="hero-title">
        Your daily dose of
        <span class="gradient-text">tech insights</span>
      </h1>
      <p class="hero-subtitle">
        AI, web development, programming tips, and everything in between — delivered fresh every day.
      </p>
    </div>
  </section>

  <!-- Posts Grid -->
  <main class="posts-section" id="posts">
    <div class="posts-grid">
      {{POSTS}}
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer" id="footer">
    <div class="footer-content">
      <div class="footer-brand">
        <span class="logo-icon">⚡</span>
        <span>Tech<span class="logo-accent">Guru</span></span>
      </div>
      <p class="footer-text">© 2026 TechGuru. Built with ☕ and curiosity.</p>
      <div class="footer-links">
        <a href="/rss.xml">RSS Feed</a>
        <a href="/sitemap.xml">Sitemap</a>
      </div>
    </div>
  </footer>

  <script>
    // Header scroll effect
    let lastScroll = 0;
    const header = document.getElementById('site-header');
    window.addEventListener('scroll', () => {
      const currentScroll = window.scrollY;
      if (currentScroll > 60) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
      lastScroll = currentScroll;
    });

    // Animate cards on scroll
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          entry.target.style.animationDelay = `${i * 0.08}s`;
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.post-card').forEach(card => observer.observe(card));
  </script>
</body>
</html>
