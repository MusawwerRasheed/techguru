<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{POST_TITLE}} — {{SITE_TITLE}}</title>
  <meta name="description" content="{{POST_DESCRIPTION}}" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="{{SITE_URL}}/posts/{{POST_TITLE}}.html" />

  <!-- Open Graph -->
  <meta property="og:type" content="article" />
  <meta property="og:title" content="{{POST_TITLE}}" />
  <meta property="og:description" content="{{POST_DESCRIPTION}}" />
  <meta property="og:url" content="{{SITE_URL}}/posts/{{POST_TITLE}}.html" />
  <meta property="og:site_name" content="{{SITE_TITLE}}" />
  <meta property="article:published_time" content="{{POST_DATE_ISO}}" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{POST_TITLE}}" />
  <meta name="twitter:description" content="{{POST_DESCRIPTION}}" />

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="{{SITE_TITLE}} RSS" href="/rss.xml" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/styles.css" />

  <!-- JSON-LD -->
  <script type="application/ld+json">
  {{POST_JSON_LD}}
  </script>
</head>
<body>
  <!-- Animated background -->
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <!-- Header -->
  <header class="site-header" id="site-header">
    <nav class="nav-container">
      <a href="/" class="logo" id="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">Tech<span class="logo-accent">Guru</span></span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">← All Posts</a>
        <a href="/rss.xml" class="nav-link rss-link" title="RSS Feed">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6.18 15.64a2.18 2.18 0 0 1 2.18 2.18C8.36 19 7.38 20 6.18 20C5 20 4 19 4 17.82a2.18 2.18 0 0 1 2.18-2.18M4 4.44A15.56 15.56 0 0 1 19.56 20h-2.83A12.73 12.73 0 0 0 4 7.27V4.44m0 5.66a9.9 9.9 0 0 1 9.9 9.9h-2.83A7.07 7.07 0 0 0 4 12.93V10.1Z"/></svg>
          RSS
        </a>
      </div>
    </nav>
  </header>

  <!-- Article -->
  <article class="post-page" id="post">
    <header class="post-header">
      <div class="post-meta">
        <time datetime="{{POST_DATE_ISO}}">{{POST_DATE}}</time>
        <span class="dot">·</span>
        <span>{{POST_READ_TIME}} min read</span>
        <span class="dot">·</span>
        <span>By {{POST_AUTHOR}}</span>
      </div>
      <h1 class="post-title">{{POST_TITLE}}</h1>
      <p class="post-excerpt">{{POST_DESCRIPTION}}</p>
      <div class="post-tags">{{POST_TAGS}}</div>
    </header>

    {{POST_COVER}}

    <div class="post-body" id="post-body">
      {{POST_CONTENT}}
    </div>
  </article>

  <!-- Back to top -->
  <a href="#" class="back-to-top" id="back-to-top" title="Back to top">↑</a>

  <!-- Footer -->
  <footer class="site-footer" id="footer">
    <div class="footer-content">
      <div class="footer-brand">
        <span class="logo-icon">⚡</span>
        <span>Tech<span class="logo-accent">Guru</span></span>
      </div>
      <p class="footer-text">© 2026 TechGuru. Built with ☕ and curiosity.</p>
      <div class="footer-links">
        <a href="/rss.xml">RSS Feed</a>
        <a href="/sitemap.xml">Sitemap</a>
      </div>
    </div>
  </footer>

  <script>
    // Header scroll effect
    const header = document.getElementById('site-header');
    const backToTop = document.getElementById('back-to-top');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 60) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
      if (window.scrollY > 400) {
        backToTop.classList.add('visible');
      } else {
        backToTop.classList.remove('visible');
      }
    });

    // Smooth scroll for back to top
    backToTop.addEventListener('click', (e) => {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Add copy buttons to code blocks
    document.querySelectorAll('pre code').forEach(block => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'Copy';
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(block.textContent);
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 2000);
      });
      block.parentElement.style.position = 'relative';
      block.parentElement.appendChild(btn);
    });
  </script>
</body>
</html>
